name: Count the tests

on:
  push:
    branches: [tmp-count]

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: EH3D-CORE-LIBS
      # the test that compares the readers of this repository with the ones of EH3D-COMMON takes that crate as a development dependency
      - name: Check out the sibling EH3D-COMMON (a development dependency of the comparison test)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-COMMON
          path: EH3D-COMMON
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-CORE-LIBS
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Count the tests of cargo test --workspace
        run: |
          cargo test --workspace 2>&1 | tee /tmp/t.log || true
          awk '/test result: ok/ {s += $4} END {print "TESTCOUNT=" s}' /tmp/t.log
        working-directory: EH3D-CORE-LIBS
