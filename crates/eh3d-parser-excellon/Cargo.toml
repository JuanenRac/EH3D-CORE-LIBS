[package]
name = "eh3d-parser-excellon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tolerant parser for Excellon drill files of the EH3D Fabrication Suite: it never panics, and reports what it could not understand as diagnostics with line numbers."
readme = "../../README.md"

[dependencies]
eh3d-parser-common = { path = "../eh3d-parser-common", version = ">=0.0.2" }

[dev-dependencies]
# the readers of the Bungard machines, compared with this one on the same files (tests/differential.rs)
eh3d-bungard-formats = { path = "../../../EH3D-COMMON/crates/formats", version = ">=0.0.1" }
