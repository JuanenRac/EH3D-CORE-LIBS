# The size limits of the text the readers take: a file past a hard limit is refused with a stated reason; a file past a warning limit is read and a program should say it is big.
# One `key = value` per line; a line that starts with `#` is a comment. A program may carry its own copy of this file and read it with TextLimits::from_config.
max_bytes = 268435456
max_lines = 40000000
warn_bytes = 67108864
warn_lines = 4000000
