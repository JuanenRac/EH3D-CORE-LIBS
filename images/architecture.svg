<title id="t">EH3D-CORE-LIBS architecture</title>
<desc id="d">EH3D-CORE-LIBS is a Rust workspace with three readers that have no dependencies: Gerber RS-274X, Excellon drill files and G-code with a modal interpreter. Each takes text from a person who may be careless or hostile and returns the data plus diagnostics with line numbers; none of them panics. No program of the suite uses them yet. They draw nothing and move nothing.</desc>
